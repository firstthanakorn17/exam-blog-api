services:
  postgres:
    image: postgres:16-alpine
    container_name: exam-blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: examblog
      POSTGRES_PASSWORD: examblog_pass
      POSTGRES_DB: examblog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examblog -d examblog"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: exam-blog-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
